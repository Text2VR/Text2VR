<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text2VR Panorama Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            height: 100px;
            resize: vertical;
        }
        
        .generate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .generate-btn:hover {
            transform: translateY(-2px);
        }
        
        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        
        .status-message {
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .status-queued { color: #ffc107; }
        .status-processing { color: #17a2b8; }
        .status-completed { color: #28a745; }
        .status-failed { color: #dc3545; }
        
        .panorama-section {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        
        .panorama-image {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text2VR Panorama Generator</h1>
        
        <div class="input-section">
            <div class="input-group">
                <label for="textInput">Describe your panorama scene:</label>
                <textarea 
                    id="textInput" 
                    placeholder="Enter a description of the panoramic scene you want to generate (e.g., 'A peaceful forest with tall trees and sunlight filtering through the leaves')"
                ></textarea>
            </div>
            
            <div class="input-group">
                <label for="sceneNameInput">Scene name (optional):</label>
                <input 
                    type="text" 
                    id="sceneNameInput" 
                    placeholder="Leave empty for auto-generated name"
                >
            </div>
            
            <button class="generate-btn" onclick="generatePanorama()">
                Generate Scene
            </button>
        </div>
        
        <div class="status-section" id="statusSection">
            <div class="status-message" id="statusMessage"></div>
        </div>
        
        <div class="panorama-section" id="panoramaSection">
            <h3>Generated Panorama:</h3>
            <img id="panoramaImage" class="panorama-image" alt="Generated panorama">
        </div>
    </div>

    <script>
        let currentTaskId = null;
        let statusCheckInterval = null;

        async function generatePanorama() {
            const textInput = document.getElementById('textInput');
            const sceneNameInput = document.getElementById('sceneNameInput');
            const generateBtn = document.querySelector('.generate-btn');
            const statusSection = document.getElementById('statusSection');
            const panoramaSection = document.getElementById('panoramaSection');
            
            const text = textInput.value.trim();
            if (!text) {
                alert('Please enter a description for your panorama scene.');
                return;
            }
            
            // Reset UI
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="loading-spinner"></span> Generating...';
            statusSection.style.display = 'block';
            panoramaSection.style.display = 'none';
            
            try {
                // Start generation
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        scene_name: sceneNameInput.value.trim() || null
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to start generation');
                }
                
                const result = await response.json();
                currentTaskId = result.task_id;
                
                updateStatus('queued', result.message);
                startStatusChecking();
                
            } catch (error) {
                console.error('Error:', error);
                updateStatus('failed', `Error: ${error.message}`);
                resetUI();
            }
        }
        
        function startStatusChecking() {
            statusCheckInterval = setInterval(checkStatus, 2000);
        }
        
        function stopStatusChecking() {
            if (statusCheckInterval) {
                clearInterval(statusCheckInterval);
                statusCheckInterval = null;
            }
        }
        
        async function checkStatus() {
            if (!currentTaskId) return;
            
            try {
                const response = await fetch(`/status/${currentTaskId}`);
                if (!response.ok) {
                    throw new Error('Failed to check status');
                }
                
                const status = await response.json();
                updateStatus(status.status, status.message);
                
                if (status.status === 'completed') {
                    stopStatusChecking();
                    showPanorama(currentTaskId);
                    resetUI();
                } else if (status.status === 'failed') {
                    stopStatusChecking();
                    resetUI();
                }
                
            } catch (error) {
                console.error('Status check error:', error);
                updateStatus('failed', `Status check error: ${error.message}`);
                stopStatusChecking();
                resetUI();
            }
        }
        
        function updateStatus(status, message) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = message;
            statusMessage.className = `status-message status-${status}`;
        }
        
        function showPanorama(taskId) {
            const panoramaSection = document.getElementById('panoramaSection');
            const panoramaImage = document.getElementById('panoramaImage');
            
            panoramaImage.src = `/panorama/${taskId}?t=${Date.now()}`;
            panoramaSection.style.display = 'block';
        }
        
        function resetUI() {
            const generateBtn = document.querySelector('.generate-btn');
            generateBtn.disabled = false;
            generateBtn.innerHTML = 'Generate Panorama';
        }
    </script>
</body>
</html>
