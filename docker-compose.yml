version: '3.8'

services:
  # Panorama Generation API
  panorama-api:
    image: 0in11/text2vr-dreamscene360:v3
    container_name: text2vr_panorama_api
    working_dir: /workspace/DREAMSCENE360
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NVIDIA_VISIBLE_DEVICES=all
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - ./output:/workspace/output
      - ./pre_checkpoints:/workspace/DREAMSCENE360/pre_checkpoints
      - ./cache/torch:/root/.cache/torch
    command: [ "bash", "/workspace/DREAMSCENE360/start_api.sh" ]
    restart: unless-stopped

  # Segmentation API
  segmentation-api:
    image: 0in11/text2vr-asset_seg:v2
    container_name: text2vr_segmentation_api
    working_dir: /app
    ports:
      - "8002:8002"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NVIDIA_VISIBLE_DEVICES=all
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - ./output:/workspace/output
      - ./pre_checkpoints:/app/checkpoints
    command: [ "bash", "/app/start_api.sh" ]
    restart: unless-stopped

  # Background Inpainting API
  inpainting-api:
    image: 0in11/text2vr-bg_inpaint:v3
    container_name: text2vr_inpainting_api
    working_dir: /workspace
    ports:
      - "8003:8003"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - ./output:/workspace/output
      - ./cache/hf:/root/.cache/huggingface
      - ./cache/torch:/root/.cache/torch
    command: [ "bash", "/workspace/start_api.sh" ]
    restart: unless-stopped

  # TRELLIS 3D Asset Generation API
  trellis-api:
    image: 0in11/trellis:v1
    container_name: text2vr_trellis_api
    working_dir: /app
    ports:
      - "8004:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SPCONV_ALGO=native
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - ./output:/workspace/output
    command: [ "python", "/app/trellis_api_v2.py" ]
    restart: unless-stopped
